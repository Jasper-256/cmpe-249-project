[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "saga-pose"
version = "0.1.0"
description = "Saturation-gated event-RGB fusion for spacecraft pose estimation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary research project" }
authors = [
  { name = "Advait Shinde" },
  { name = "Jasper Morgal" },
]
dependencies = [
  "albumentations>=2.0,<3",
  "einops>=0.8,<1",
  "h5py>=3.14,<4",
  "hydra-core>=1.3,<2",
  "imageio>=2.37,<3",
  "kornia>=0.8,<1",
  "matplotlib>=3.10,<4",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.11,<5",
  "pandas>=2.3,<4",
  "pillow>=11.3,<13",
  "pyyaml>=6.0,<7",
  "rich>=14,<15",
  "scikit-learn>=1.7,<2",
  "scipy>=1.16,<2",
  "tensorboard>=2.20,<3",
  "timm>=1.0,<2",
  "torch>=2.14,<2.15",
  "torchvision>=0.29,<0.30",
  "tqdm>=4.67,<5",
  "typer>=0.17,<1",
]

[project.optional-dependencies]
tracking = ["wandb>=0.21,<1"]
notebooks = ["ipykernel>=6.30,<8", "jupyterlab>=4.4,<5", "seaborn>=0.13,<1"]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/saga_pose"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["saga_pose"]

