description: Stage B (16-sample overfit) and Stage C (Cassini 1024/256, frozen HRNet-reference
  protocol) backbone screen under crop-v2, raw event frames, natural protocol, seed
  249.
defaults:
  objects:
  - cassini
  train_limit: 1024
  validation_limit: 256
  epochs: 12
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001
  schedule: constant
  warmup_steps: 0
  patience: 3
  min_improvement_px: 0.25
  protocol: natural
  event_representation: raw
  seed: 249
  workers: 3
  output_dir: outputs/runs/screen
runs:
- name: screen-b-a0-hrnet-rgb
  backbone: hrnet_w18_small_v2.ms_in1k
  modality: rgb
  overfit: 16
  overfit_steps: 200
- name: screen-b-a0-hrnet-event
  backbone: hrnet_w18_small_v2.ms_in1k
  modality: event
  overfit: 16
  overfit_steps: 200
- name: screen-b-a1-effb0-rgb
  backbone: efficientnet_b0.ra_in1k
  modality: rgb
  overfit: 16
  overfit_steps: 200
- name: screen-b-a1-effb0-event
  backbone: efficientnet_b0.ra_in1k
  modality: event
  overfit: 16
  overfit_steps: 200
- name: screen-b-a2-tinyvit-rgb
  backbone: tiny_vit_5m_224.dist_in22k_ft_in1k
  modality: rgb
  overfit: 16
  overfit_steps: 200
- name: screen-b-a2-tinyvit-event
  backbone: tiny_vit_5m_224.dist_in22k_ft_in1k
  modality: event
  overfit: 16
  overfit_steps: 200
- name: screen-b-a3-segformer-rgb
  backbone: hf:nvidia/mit-b0
  modality: rgb
  overfit: 16
  overfit_steps: 200
- name: screen-b-a3-segformer-event
  backbone: hf:nvidia/mit-b0
  modality: event
  overfit: 16
  overfit_steps: 200
- name: screen-b-a4-swinv2t-rgb
  backbone: swinv2_tiny_window8_256.ms_in1k
  modality: rgb
  overfit: 16
  overfit_steps: 200
- name: screen-b-a4-swinv2t-event
  backbone: swinv2_tiny_window8_256.ms_in1k
  modality: event
  overfit: 16
  overfit_steps: 200
- name: screen-b-a5-mobilevitv2-rgb
  backbone: mobilevitv2_100.cvnets_in1k
  modality: rgb
  overfit: 16
  overfit_steps: 200
- name: screen-b-a5-mobilevitv2-event
  backbone: mobilevitv2_100.cvnets_in1k
  modality: event
  overfit: 16
  overfit_steps: 200
- name: screen-c-a0-hrnet-rgb
