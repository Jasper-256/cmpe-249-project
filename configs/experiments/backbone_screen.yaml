  modality: rgb
- name: screen-c-a0-hrnet-event
  backbone: hrnet_w18_small_v2.ms_in1k
  modality: event
- name: screen-c-a1-effb0-rgb
  backbone: efficientnet_b0.ra_in1k
  modality: rgb
- name: screen-c-a1-effb0-event
  backbone: efficientnet_b0.ra_in1k
  modality: event
- name: screen-c-a2-tinyvit-rgb
  backbone: tiny_vit_5m_224.dist_in22k_ft_in1k
  modality: rgb
- name: screen-c-a2-tinyvit-event
  backbone: tiny_vit_5m_224.dist_in22k_ft_in1k
  modality: event
- name: screen-c-a3-segformer-rgb
  backbone: hf:nvidia/mit-b0
