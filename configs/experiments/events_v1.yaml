description: 'events-v1: one-factor event-only arms (representation, threshold, support filter,
  native-scale noise, strong dropout) against the sim2real-v1 activity reference. Every other
  setting is copied from sim2real_v1.yaml; checkpoints are selected on synthetic validation
  augmented with the run''s own augmentation. Real data are never used here.'
defaults:
  backbone: hrnet_w18_small_v2.ms_in1k
  train_stride: 1
  epochs: 8
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001
  schedule: cosine
  warmup_steps: 300
  patience: 3
  min_improvement_px: 0.05
  protocol: tss
  event_representation: activity
  augment: sim2real-v1
  seed: 249
  workers: 0
  output_dir: outputs/runs/events-v1
  checkpoint_dir: checkpoints/events-v1
  supplement_dir: data/fresh/cache/event-supp-v1
runs:
- name: ev-support-s249-cassini
