name: fresh-synthetic-grouped-v1
raw_root_env: SAGA_FRESH_ROOT
raw_root_default: data/fresh/raw
index_path: data/fresh/index/synthetic-split-v1.json

source:
  synthetic_members:
    - synthetic/{object}/train.json
    - synthetic/{object}/test.json
  real_role: frozen_test_only

split:
  ordering: numeric_rgb_filename
  validation_blocks_per_object: 8
  frames_per_validation_block: 80
  rotation_guard_degrees: 5.0

preprocessing:
  source_size_wh: [800, 720]
  target_size_wh: [256, 256]
  crop_source: annotation_xyxy_shared_oracle
  crop_transform: center_preserving_square
  crop_padding_factor: 1.2
  # crop-v2: RGB pads with 0 (black space); events pad with the format neutral
  # (127 synthetic, 128 real), matching the FRESH/UE-Pose loaders.
  off_frame_policy: rgb_zero_event_neutral_padding
  # Pillow BILINEAR antialiases (support-scaled filter) when downsampling; it is
  # not OpenCV INTER_LINEAR. Both use the same half-pixel-center geometry. Keep a
  # bilinear filter: its convex weights cannot create clipping, which the G1A
  # saturation conclusion relies on (bicubic/Lanczos can overshoot).
  resize_interpolation: pillow_bilinear_antialiased
  pixel_center_transform: half_pixel

units:
  annotation_translation: millimetres
  reported_translation: metres
